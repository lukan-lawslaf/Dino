services:
  # ── Backend: FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: rayquaza-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://rayquaza-frontend.onrender.com,http://localhost:5173
      - key: DATABASE_URL
        value: sqlite:///./dinosaurs.db
      # Set both in the Render dashboard (sync: false = not stored in this file).
      - key: NEWSAPI_KEY
        sync: false
      - key: NEWS_REFRESH_TOKEN
        sync: false
    healthCheckPath: /

  # ── Frontend: React/Vite static site ─────────────────────────────────────
  - type: web
    name: rayquaza-frontend
    runtime: static
    rootDir: frountend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://rayquaza-api.onrender.com
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html

# Note: the news refresh schedule deliberately does NOT live here. Render cron jobs are
# paid on the Hobby plan, so it runs as a GitHub Actions workflow instead
# (.github/workflows/refresh-news.yml), which calls POST /news/refresh on the API.
